<g transform="translate(60,60)" class="ic"><g stroke="#a78bfa" stroke-width="1.6" fill="none" stroke-linecap="round"><rect x="-6" y="-22" width="12" height="22" rx="6"/><path d="M-12,-4 Q-12,10 0,10 Q12,10 12,-4 M0,10 V18 M-7,18 H7"/></g></g>
<text x="118" y="42" font-size="17" font-weight="700" fill="#f2eefb">AURA, Privacy-First Voice AI Concierge <tspan fill="#a78bfa" font-size="14">↗</tspan></text>
<text x="876" y="42" text-anchor="end" font-size="13" fill="#8b86a0">now</text>
<text x="118" y="66" font-size="13.5" fill="#a29cb8">A smart-home voice concierge: wake word, ASR, LLM intent understanding and TTS in one local pipeline.</text><text x="118" y="86" font-size="13.5" fill="#a29cb8">Benchmarking Parakeet and Faster-Whisper, with ESP32-S3 and ReSpeaker mics for room-level interfaces.</text><rect x="118" y="106" width="77" height="28" rx="14" fill="#1b1829" stroke="#2a2340"/><text x="156.5" y="124.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#e6e0f5">FastAPI</text><rect x="203" y="106" width="99" height="28" rx="14" fill="#1b1829" stroke="#2a2340"/><text x="252.5" y="124.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#e6e0f5">WebSockets</text><rect x="310" y="106" width="128" height="28" rx="14" fill="#1b1829" stroke="#2a2340"/><text x="374.0" y="124.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#e6e0f5">Faster-Whisper</text><rect x="446" y="106" width="84" height="28" rx="14" fill="#1b1829" stroke="#2a2340"/><text x="488.0" y="124.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#e6e0f5">Parakeet</text><rect x="538" y="106" width="55" height="28" rx="14" fill="#1b1829" stroke="#2a2340"/><text x="565.5" y="124.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#e6e0f5">Qwen</text><rect x="601" y="106" width="62" height="28" rx="14" fill="#1b1829" stroke="#2a2340"/><text x="632.0" y="124.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#e6e0f5">Gemma</text><rect x="671" y="106" width="84" height="28" rx="14" fill="#1b1829" stroke="#2a2340"/><text x="713.0" y="124.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#e6e0f5">ESP32-S3</text>
</g></svg>