<svg xmlns="http://www.w3.org/2000/svg" width="900" height="156" viewBox="0 0 900 156" role="img" aria-label="AURA, Privacy-First Voice AI Concierge">
<style>
text{font-family:Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.in{animation:in .9s ease-out 0.2s backwards}@keyframes in{from{opacity:0}}
.ic{animation:pulse 4.5s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
.bar{animation:bar 6s ease-in-out infinite}@keyframes bar{0%,100%{opacity:.3}50%{opacity:1}}
</style>
<rect width="900" height="156" rx="18" fill="#110f1b"/>
<rect x=".5" y=".5" width="899" height="155" rx="18" fill="none" stroke="#2a2340"/>
