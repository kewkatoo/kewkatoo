.bar{animation:bar 6s ease-in-out infinite}@keyframes bar{0%,100%{opacity:.3}50%{opacity:1}}</style><rect width="900" height="222" rx="18" fill="#110f1b"/><rect x=".5" y=".5" width="899" height="221" rx="18" fill="none" stroke="#2a2340"/><rect class="bar" x="0" y="26" width="3" height="170" rx="1.5" fill="#8b5cf6"/><text x="32" y="46" font-size="16" font-weight="700" fill="#f2eefb">Ashok Leyland</text><text x="868" y="46" text-anchor="end" font-size="13" fill="#8b86a0">internship</text><text x="32" y="72" font-size="13.5" fill="#a29cb8">Hybrid recommendation approaches combining collaborative filtering, Sentence Transformers and SVD.</text><text x="32" y="92" font-size="13.5" fill="#a29cb8">Python and SQL data-processing workflows, plus Power BI dashboards.</text><line x1="32" x2="868" y1="112" y2="112" stroke="#2a2340" stroke-opacity=".6"/><text x="32" y="150" font-size="16" font-weight="700" fill="#f2eefb">Student Social Responsibility Initiative</text><text x="868" y="150" text-anchor="end" font-size="13" fill="#8b86a0">outreach</text><text x="32" y="176" font-size="13.5" fill="#a29cb8">AI and computational thinking workshops for 80+ school students.</text><text x="32" y="196" font-size="13.5" fill="#a29cb8">Introduced younger learners to programming, problem-solving and the basics of AI.</text></svg>