<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Song Recommendation Framework">
  <defs>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c5cff"/>
      <stop offset="50%" stop-color="#5b3df5"/>
      <stop offset="100%" stop-color="#2b174f"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="100%" height="100%" rx="28" fill="#090714"/>
  <rect x="10" y="10" width="1180" height="300" rx="24" fill="#0d0a1a" stroke="url(#borderGrad)" stroke-width="2"/>
  <text x="50%" y="48" text-anchor="middle" fill="#f5f3ff" font-size="28" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="600">Song Recommendation Framework</text>
  
<g>
  <rect x="170" y="150" width="18" height="60" rx="9" fill="#8b6cff"><animate attributeName="height" values="60;100;60" dur="0.9s" repeatCount="indefinite"/><animate attributeName="y" values="150;130;150" dur="0.9s" repeatCount="indefinite"/></rect><rect x="205" y="130" width="18" height="100" rx="9" fill="#8b6cff"><animate attributeName="height" values="100;60;100" dur="1.1s" repeatCount="indefinite"/><animate attributeName="y" values="130;150;130" dur="1.1s" repeatCount="indefinite"/></rect><rect x="240" y="165" width="18" height="30" rx="9" fill="#8b6cff"><animate attributeName="height" values="30;80;30" dur="1.0s" repeatCount="indefinite"/><animate attributeName="y" values="165;140;165" dur="1.0s" repeatCount="indefinite"/></rect><rect x="275" y="120" width="18" height="120" rx="9" fill="#8b6cff"><animate attributeName="height" values="120;70;120" dur="1.2s" repeatCount="indefinite"/><animate attributeName="y" values="120;145;120" dur="1.2s" repeatCount="indefinite"/></rect><rect x="310" y="145" width="18" height="70" rx="9" fill="#8b6cff"><animate attributeName="height" values="70;110;70" dur="0.95s" repeatCount="indefinite"/><animate attributeName="y" values="145;125;145" dur="0.95s" repeatCount="indefinite"/></rect>
  <path d="M390 180 C430 110,470 250,510 180 S590 110,630 180 S710 250,750 180"
        fill="none" stroke="#5b3df5" stroke-width="4" stroke-linecap="round">
    <animate attributeName="d" dur="2s" repeatCount="indefinite"
      values="M390 180 C430 110,470 250,510 180 S590 110,630 180 S710 250,750 180;M390 180 C430 140,470 220,510 180 S590 140,630 180 S710 220,750 180;M390 180 C430 110,470 250,510 180 S590 110,630 180 S710 250,750 180"/>
  </path>
  <line x1="760" y1="180" x2="860" y2="120" stroke="#20163b" stroke-width="2"/><line x1="760" y1="180" x2="940" y2="180" stroke="#20163b" stroke-width="2"/><line x1="760" y1="180" x2="860" y2="240" stroke="#20163b" stroke-width="2"/><line x1="940" y1="180" x2="1020" y2="180" stroke="#20163b" stroke-width="2"/>
  <circle cx="860" cy="120" r="11" fill="#0d0a1a" stroke="#8b6cff" stroke-width="2"/><circle cx="940" cy="180" r="11" fill="#0d0a1a" stroke="#8b6cff" stroke-width="2"/><circle cx="860" cy="240" r="11" fill="#0d0a1a" stroke="#8b6cff" stroke-width="2"/><circle cx="1020" cy="180" r="11" fill="#0d0a1a" stroke="#8b6cff" stroke-width="2"/>
  <circle r="5" fill="#8b6cff" filter="url(#softGlow)"><animateMotion dur="2.8s" repeatCount="indefinite" path="M 760 180 L 860 120 L 940 180 L 1020 180"/></circle>
</g>

</svg>