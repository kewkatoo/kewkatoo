<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Real-Time IoT Bus Detection">
  <defs>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c5cff"/>
      <stop offset="50%" stop-color="#5b3df5"/>
      <stop offset="100%" stop-color="#2b174f"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="100%" height="100%" rx="28" fill="#090714"/>
  <rect x="10" y="10" width="1180" height="300" rx="24" fill="#0d0a1a" stroke="url(#borderGrad)" stroke-width="2"/>
  <text x="50%" y="48" text-anchor="middle" fill="#f5f3ff" font-size="28" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="600">Real-Time IoT Bus Detection</text>
  
<g transform="translate(180,95)">
  <rect x="0" y="40" width="300" height="110" rx="18" fill="none" stroke="#8b6cff" stroke-width="4"/>
  <rect x="20" y="60" width="50" height="35" rx="6" fill="none" stroke="#5b3df5" stroke-width="2"/><rect x="85" y="60" width="50" height="35" rx="6" fill="none" stroke="#5b3df5" stroke-width="2"/><rect x="150" y="60" width="50" height="35" rx="6" fill="none" stroke="#5b3df5" stroke-width="2"/><rect x="215" y="60" width="50" height="35" rx="6" fill="none" stroke="#5b3df5" stroke-width="2"/>
  <circle cx="65" cy="165" r="16" fill="none" stroke="#8b6cff" stroke-width="3"/>
  <circle cx="235" cy="165" r="16" fill="none" stroke="#8b6cff" stroke-width="3"/>
  <rect x="-10" y="30" width="320" height="130" rx="20" fill="none" stroke="#5b3df5" stroke-width="2">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="1.8s" repeatCount="indefinite"/>
  </rect>
</g>
<line x1="600" y1="100" x2="600" y2="250" stroke="#8b6cff" stroke-width="3" opacity="0.9">
  <animate attributeName="x1" values="560;640;560" dur="2s" repeatCount="indefinite"/>
  <animate attributeName="x2" values="560;640;560" dur="2s" repeatCount="indefinite"/>
</line>
<line x1="740" y1="175" x2="920" y2="175" stroke="#20163b" stroke-width="2"/>
<circle cx="920" cy="175" r="22" fill="none" stroke="#8b6cff" stroke-width="3"/>
<circle cx="980" cy="175" r="12" fill="#8b6cff" opacity="0.95"/>
<circle r="5" fill="#8b6cff" filter="url(#softGlow)"><animateMotion dur="2.2s" repeatCount="indefinite" path="M 500 175 L 740 175 L 920 175 L 980 175"/></circle>

</svg>