<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Intelligent Prosthetic Arm">
  <defs>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c5cff"/>
      <stop offset="50%" stop-color="#5b3df5"/>
      <stop offset="100%" stop-color="#2b174f"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="100%" height="100%" rx="28" fill="#090714"/>
  <rect x="10" y="10" width="1180" height="300" rx="24" fill="#0d0a1a" stroke="url(#borderGrad)" stroke-width="2"/>
  <text x="50%" y="48" text-anchor="middle" fill="#f5f3ff" font-size="28" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="600">Intelligent Prosthetic Arm</text>
  
<g transform="translate(250,65)">
  <path d="M160 170 C150 140,150 120,150 90 L150 55 M185 165 L180 75 M215 165 L215 62 M245 168 L255 85 M275 175 L295 110 M155 175 C175 210,235 210,270 180"
        fill="none" stroke="#8b6cff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="160" cy="80" r="3" fill="#5b3df5"><animate attributeName="opacity" values="0;1;0" dur="2.4s" begin="0.1s" repeatCount="indefinite"/></circle><circle cx="180" cy="100" r="3" fill="#5b3df5"><animate attributeName="opacity" values="0;1;0" dur="2.2s" begin="0.5s" repeatCount="indefinite"/></circle><circle cx="210" cy="90" r="3" fill="#5b3df5"><animate attributeName="opacity" values="0;1;0" dur="2.0s" begin="0.8s" repeatCount="indefinite"/></circle><circle cx="245" cy="110" r="3" fill="#5b3df5"><animate attributeName="opacity" values="0;1;0" dur="2.1s" begin="1.1s" repeatCount="indefinite"/></circle><circle cx="280" cy="140" r="3" fill="#5b3df5"><animate attributeName="opacity" values="0;1;0" dur="2.3s" begin="1.5s" repeatCount="indefinite"/></circle><circle cx="220" cy="180" r="3" fill="#5b3df5"><animate attributeName="opacity" values="0;1;0" dur="2.5s" begin="1.8s" repeatCount="indefinite"/></circle>
</g>
<line x1="560" y1="180" x2="838" y2="180" stroke="#20163b" stroke-width="3"/>
<circle cx="860" cy="180" r="22" fill="none" stroke="#8b6cff" stroke-width="3"/>
<circle cx="860" cy="180" r="6" fill="#8b6cff">
  <animate attributeName="r" values="6;10;6" dur="1.7s" repeatCount="indefinite"/>
</circle>
<rect x="820" y="140" width="80" height="80" rx="8" fill="none" stroke="#5b3df5" stroke-width="2">
  <animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite"/>
</rect>

</svg>