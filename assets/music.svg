<svg xmlns="http://www.w3.org/2000/svg" width="900" height="230" viewBox="0 0 900 230" role="img" aria-label="now playing, music producer">
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#8b5cf6" stop-opacity=".3"/></linearGradient>
<linearGradient id="pr" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#a78bfa"/></linearGradient></defs>
<style>
text{font-family:Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.b{fill:url(#bg);transform-box:fill-box;transform-origin:50% 100%;animation:eq ease-in-out infinite alternate}
@keyframes eq{from{transform:scaleY(.22)}to{transform:scaleY(1)}}
.tw{animation:tw ease-in-out infinite;opacity:.15}
@keyframes tw{0%,100%{opacity:.12}50%{opacity:.9}}

.pr{transform-box:fill-box;transform-origin:0 50%;animation:pr 24s linear infinite}@keyframes pr{from{transform:scaleX(.02)}to{transform:scaleX(1)}}
.dot{animation:dot 1.6s ease-in-out infinite}@keyframes dot{0%,100%{opacity:1}50%{opacity:.25}}
</style>
