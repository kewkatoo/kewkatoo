name: update contribution city

on:
  schedule:
    - cron: "10 */6 * * *"   # every 6 hours
  workflow_dispatch:          # lets you run it by hand from the Actions tab
  push:
    paths:
      - "scripts/gen_city.py"
      - "scripts/build_profile.py"
      - "scripts/gen_projects.py"

permissions:
  contents: write

jobs:
  city:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: build city
        run: python scripts/gen_city.py
        env:
          GH_USER: kewkatoo
      - name: build unified profile image
        run: python scripts/build_profile.py
      - name: commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/city.svg assets/profile.svg
          git diff --cached --quiet || (git commit -m "update contribution city" && git push)
